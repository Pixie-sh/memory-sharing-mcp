name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove keys, memory content, and private paths from anything you paste.
        For a security problem, use the security link instead of this form.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make setup
        2. AGENT=claude make gen-config
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `memory-sharing-mcp version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, OpenCode, Pi, Codex, Other, Not agent-related]
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and version
      placeholder: mnemosyne 3.15.1
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `make logs` or the agent's MCP output.
      render: text
