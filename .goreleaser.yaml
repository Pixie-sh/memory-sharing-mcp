# Release builds, run by .github/workflows/release.yml when a v* tag is pushed.
# Try locally: goreleaser release --snapshot --clean
version: 2

project_name: memory-sharing-mcp

builds:
  - main: ./cmd/memory-sharing-mcp
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Tag}}"]

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
